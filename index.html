<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Disiplin Amirleri"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>İçişleri Disiplin Amirleri | Ezber</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#101827;color:#f8fafc}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:20px 15px 60px}header h1{font-size:clamp(23px,4vw,32px);margin:0 0 8px}header p,.muted{color:#aebdd0}header p{font-size:13px;margin:0}.tabs{display:flex;gap:8px;overflow-x:auto;margin:20px 0}.tabs button{border:1px solid #43546a;background:#26354b;color:#fff;border-radius:11px;padding:12px 17px;white-space:nowrap;font-weight:700}.tabs button.active{background:#3278dc;border-color:#6ca5ff}.panel{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:clamp(16px,3vw,27px);min-height:300px}select,input{width:100%;background:#0f172a;border:1px solid #64748b;border-radius:10px;color:#fff;padding:12px;font:inherit}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.filters label{display:block;font-size:13px;color:#cbd5e1}.filters select{margin-top:5px}.question{padding:24px 10px;text-align:center}.question h2{font-size:clamp(21px,4vw,30px);line-height:1.4}.question .unit{color:#93c5fd;font-weight:700;font-size:14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.options button{background:#27384e;border:1px solid #64748b;color:white;text-align:left;border-radius:12px;padding:16px;font:inherit;font-weight:650;min-height:72px}.options button.correct{background:#166534;border-color:#4ade80}.options button.wrong{background:#991b1b;border-color:#fca5a5}.options button:disabled{cursor:default;opacity:1}.source-proof{display:none;margin:14px 0 18px;padding:17px;background:#101c2c;border:1px solid #52739a;border-radius:13px}.source-proof.visible{display:block}.source-proof h3{margin:0 0 8px;font-size:17px;color:#bfdbfe}.source-proof .source-path{color:#b9c8d9;font-size:12px;margin:0 0 13px}.source-proof .source-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}.source-proof .source-label{font-size:11px;color:#93c5fd;font-weight:700;letter-spacing:.04em;margin-bottom:6px}.source-proof .source-value{font-size:15px;line-height:1.55;overflow-wrap:anywhere}.source-proof .source-note{font-size:12px;color:#cbd5e1;margin:12px 0 0}.feedback{min-height:48px;text-align:center;margin:16px 0;font-weight:700}.primary,.secondary{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#3b82f6;color:white}.secondary{background:#475569;color:white}.primary:disabled{opacity:.45}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.progress{text-align:center;color:#aebdd0;margin:15px 0}.list{display:grid;gap:9px;margin-top:16px}.entry{background:#101827;border:1px solid #334155;border-radius:11px;padding:12px}.entry b{display:block;margin-bottom:5px}.entry small{color:#93c5fd}.entry p{margin:7px 0 0;color:#dce5ef}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#101827;padding:18px 8px;text-align:center;border-radius:12px}.stat strong{display:block;font-size:28px}.stat small{color:#aebdd0}.hint{font-size:13px;color:#aebdd0;line-height:1.6}footer{margin-top:20px;text-align:center;font-size:12px;color:#94a3b8}@media(max-width:600px){.filters,.options,.source-proof .source-grid{grid-template-columns:1fr}.question{padding:15px 0}.options button{min-height:58px}.stat strong{font-size:23px}}
</style></head><body><main><header><h1>⚖️ İçişleri Bakanlığı Disiplin Amirleri</h1><p>Birim bazlı sınav • Unvan bazlı öğrenme • Çevrimdışı çalışma</p></header><nav class="tabs" id="tabs"></nav><section class="panel" id="app"><p>Veriler yükleniyor…</p></section><footer>Kaynak: Kullanıcının sağladığı İçişleri Bakanlığı Disiplin Amirleri Cetveli (Ek-1). Resmî güncellik ayrıca kontrol edilmelidir. İlerlemeniz yalnızca bu cihazda saklanır.</footer></main><script>
'use strict';let Q=[],view='quiz',group='all',unit='all',queue=[],current=null,answered=false,session={right:0,total:0};const KEY='disiplin-amirleri-v1',TABS=[['quiz','Sınav'],['learn','Öğren'],['missed','Yanlışlarım'],['stats','İstatistik']];let history={};try{history=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function save(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){}}function state(id){return history[id]||(history[id]={right:0,wrong:0,missed:false})}function opts(items,value){return items.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')};function groups(){return [...new Set(Q.map(x=>x.group))]};function units(){return [...new Set(Q.filter(x=>group==='all'||x.group===group).map(x=>x.unit))]};function selected(){return Q.filter(x=>(group==='all'||x.group===group)&&(unit==='all'||x.unit===unit))};function renderTabs(){$('tabs').innerHTML=TABS.map(([k,v])=>`<button data-tab="${k}" class="${view===k?'active':''}">${v}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>changeView(b.dataset.tab))}function changeView(v){view=v;renderTabs();if(v==='quiz'||v==='missed')renderQuiz();else if(v==='learn')renderLearn();else renderStats()}
function filterHtml(){return `<div class="filters"><label>Teşkilat <select id="group"><option value="all">Tüm teşkilatlar</option>${opts(groups(),group)}</select></label><label>Birim <select id="unit"><option value="all">Tüm birimler</option>${opts(units(),unit)}</select></label></div>`}function wireFilters(render){$('group').onchange=e=>{group=e.target.value;unit='all';render()};$('unit').onchange=e=>{unit=e.target.value;render()}}
function renderQuiz(){$('app').innerHTML=filterHtml()+`<div class="progress" id="progress"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><section class="source-proof" id="sourceProof" aria-live="polite"></section><div class="actions"><button class="primary" id="next">Sonraki soru →</button><button class="secondary" id="restart">Yeni tur / Karıştır</button></div>`;wireFilters(renderQuiz);$('next').onclick=next;$('restart').onclick=reset;reset()}
function reset(){queue=shuffle(selected().filter(x=>view!=='missed'||state(x.id).missed));session={right:0,total:0};next()}function next(){answered=false;const proof=$('sourceProof');if(proof){proof.classList.remove('visible');proof.innerHTML='';}current=queue.pop()||null;$('next').disabled=true;if(!current){$('question').innerHTML='<h2>Bu bölüm tamamlandı.</h2>';$('options').innerHTML='';$('feedback').textContent=view==='missed'?'Tekrar edilecek yanlış soru kalmadı.':'Yeni tur başlatabilirsiniz.';updateProgress();return}const choices=[current.answer];const allAnswers=[...new Set(selected().map(x=>x.answer))];const fallback=[...new Set(Q.map(x=>x.answer))];shuffle(allAnswers.filter(x=>x!==current.answer)).forEach(x=>{if(choices.length<4)choices.push(x)});shuffle(fallback.filter(x=>!choices.includes(x))).forEach(x=>{if(choices.length<4)choices.push(x)});shuffle(choices);$('question').innerHTML=`<div class="unit">${esc(current.group)} • ${esc(current.unit)}</div><h2>${esc(current.title)}</h2><div class="muted">Bu unvanın disiplin amiri kimdir?</div>`;$('options').innerHTML=choices.map(x=>`<button data-choice="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(b.dataset.choice));$('feedback').textContent='';updateProgress()}
function answer(choice){if(answered||!current)return;answered=true;const ok=choice===current.answer,s=state(current.id);s[ok?'right':'wrong']++;s.missed=!ok;save();session.total++;if(ok)session.right++;document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(b.dataset.choice===current.answer)b.classList.add('correct');else if(b.dataset.choice===choice)b.classList.add('wrong')});$('feedback').innerHTML=ok?'✓ Doğru!':`✗ Yanlış. Doğru cevap: <strong>${esc(current.answer)}</strong>`;$('feedback').style.color=ok?'#86efac':'#fda4af';$('next').disabled=false;showSource(current);updateProgress()}
function showSource(item){const proof=$('sourceProof');if(!proof||!item)return;const path=[item.group,item.subgroup,item.unit].filter(Boolean).join(' / ');proof.innerHTML=`<h3>📖 Cetveldeki ilgili satır</h3><p class="source-path">${esc(path)}</p><div class="source-grid"><div><div class="source-label">BİRİM / UNVAN</div><div class="source-value">${esc(item.sourceText||item.title)}</div></div><div><div class="source-label">DİSİPLİN AMİRİ</div><div class="source-value"><strong>${esc(item.answer)}</strong></div></div></div>${item.sourceNote?`<p class="source-note">${esc(item.sourceNote)}</p>`:''}`;proof.classList.add('visible')}
function updateProgress(){$('progress').textContent=`Bu tur: ${session.right}/${session.total} doğru • Kalan: ${queue.length+(current&&!answered?1:0)} soru`}
function renderLearn(){$('app').innerHTML=filterHtml()+`<p class="hint" id="count"></p><input id="search" type="search" placeholder="Unvan veya disiplin amiri ara…" aria-label="Ara"><div class="list" id="entries"></div>`;wireFilters(renderLearn);$('search').oninput=renderEntries;renderEntries()}function renderEntries(){let term=$('search').value.toLocaleLowerCase('tr');let rows=selected().filter(x=>(x.title+' '+x.answer+' '+x.unit).toLocaleLowerCase('tr').includes(term));$('count').textContent=`${rows.length} soru / unvan gösteriliyor`;$('entries').innerHTML=rows.map(x=>`<div class="entry"><small>${esc(x.unit)}</small><b>${esc(x.title)}</b><p>Disiplin amiri: <strong>${esc(x.answer)}</strong></p></div>`).join('')||'<p class="muted">Eşleşen kayıt yok.</p>'}
function renderStats(){const right=Q.reduce((s,x)=>s+state(x.id).right,0),wrong=Q.reduce((s,x)=>s+state(x.id).wrong,0),missed=Q.filter(x=>state(x.id).missed);$('app').innerHTML=`<h2>Çalışma istatistikleri</h2><div class="stats"><div class="stat"><strong>${right+wrong}</strong><small>Yanıt</small></div><div class="stat"><strong>${right+wrong?Math.round(100*right/(right+wrong)):0}%</strong><small>Başarı</small></div><div class="stat"><strong>${missed.length}</strong><small>Yanlışlarım</small></div></div><h3>Birim bazında başarı</h3><div class="list">${[...new Set(Q.map(x=>x.unit))].map(u=>{const a=Q.filter(x=>x.unit===u),r=a.reduce((s,x)=>s+state(x.id).right,0),w=a.reduce((s,x)=>s+state(x.id).wrong,0);return `<div class="entry"><b>${esc(u)}</b><p>${a.length} soru • ${r+w} yanıt • ${r+w?Math.round(100*r/(r+w)):0}% başarı</p></div>`}).join('')}</div><div class="actions" style="margin-top:20px"><button class="secondary" id="clear">İstatistikleri sıfırla</button></div>`;$('clear').onclick=()=>{if(confirm('Tüm çalışma geçmişini silmek istiyor musunuz?')){history={};save();renderStats()}}}
fetch('./questions.json').then(r=>{if(!r.ok)throw Error('Soru dosyası bulunamadı');return r.json()}).then(data=>{Q=data;changeView('quiz')}).catch(e=>{$('app').innerHTML='<h2>Veriler yüklenemedi</h2><p>Uygulamayı GitHub Pages üzerinden açın ve questions.json dosyasının yüklendiğini kontrol edin.</p><p>'+esc(e.message)+'</p>'});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
